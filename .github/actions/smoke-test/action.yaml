name: Smoke Test

description: Health-checks a deployed service with retry logic.

inputs:
  service-name:
    description: Service name (for logging)
    required: true
  expected-url:
    description: Base URL of the deployed service
    required: true
    type: string
  health-endpoint:
    description: Health endpoint path
    required: false
    type: string
    default: /actuator/health

outputs:
  passed:
    description: Whether the health check passed
    value: ${{ steps.smoke.outputs.passed }}

runs:
  using: composite

  steps:
    - name: Run smoke test
      id: smoke
      shell: bash
      run: |
        URL="${{ inputs.expected-url }}"
        ENDPOINT="${{ inputs.health-endpoint }}"
        SVC="${{ inputs.service-name }}"
        FULL_URL=$(echo "$URL" | sed 's#/+$#')"$ENDPOINT"

        PASSED="false"
        for attempt in 1 2 3 4 5; do
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$FULL_URL" || echo "000")
          echo "Attempt $attempt for $SVC: HTTP $HTTP_CODE ($FULL_URL)"
          if [ "$HTTP_CODE" -ge 200 ] 2>/dev/null && [ "$HTTP_CODE" -lt 300 ] 2>/dev/null; then
            PASSED="true"
            break
          fi
          sleep 10
        done

        if [ "$PASSED" = "true" ]; then
          echo "PASSED: $SVC health check passed"
        else
          echo "::error::FAILED: $SVC health check failed (last HTTP $HTTP_CODE)"
        fi
        echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
