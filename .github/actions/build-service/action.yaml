name: Build Service

description: >
  Builds a single service from its precompiled JAR into a shared Dockerfile,
  pushes to the configured registry (GITHUB_REGISTRY, DOCKER_REGISTRY, or AZURE_REGISTRY),
  captures the image digest, and performs optional security scanning / signing.

inputs:
  service-name:
    description: Service directory name under services/
    required: true
  acr-name:
    description: ACR Login Server (e.g. alramzregistry.azurecr.io)
    required: false
  image-tag:
    description: Image tag to apply
    required: true
  github-token:
    description: GitHub token for registry authentication
    required: true
    type: string
  azure-client-id:
    description: Azure OIDC client id
    required: false
    type: string
  azure-tenant-id:
    description: Azure OIDC tenant id
    required: false
    type: string
  azure-subscription-id:
    description: Azure subscription id
    required: false
    type: string
  registry-target:
    description: Target registry to push images (GITHUB_REGISTRY, DOCKER_REGISTRY, AZURE_REGISTRY)
    required: false
    type: string
    default: GITHUB_REGISTRY
  dockerhub-username:
    description: Docker Hub username (required when registry-target is DOCKER_REGISTRY)
    required: false
    type: string
    default: ''
  dockerhub-password:
    description: Docker Hub password/token (required when registry-target is DOCKER_REGISTRY)
    required: false
    type: string
    default: ''
  scan-trivy:
    description: Run Trivy vulnerability scan (fails on CRITICAL/HIGH)
    required: false
    type: boolean
    default: false
  sign-cosign:
    description: Sign the image with cosign (keyless)
    required: false
    type: boolean
    default: false

outputs:
  image:
    description: Full image reference with digest
    value: ${{ steps.build.outputs.image }}
  image-digest:
    description: Image digest (sha256:...)
    value: ${{ steps.build.outputs.image-digest }}

runs:
  using: composite

  steps:
    - name: Azure OIDC login
      if: ${{ inputs.registry-target == 'AZURE_REGISTRY' && inputs.azure-client-id != '' }}
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        subscription-id: ${{ inputs.azure-subscription-id }}

    - name: Login to ACR
      if: ${{ inputs.registry-target == 'AZURE_REGISTRY' }}
      shell: bash
      run: |
        ACR_NAME="${{ inputs.acr-name }}"
        ACR_NAME="${ACR_NAME%%.azurecr.io}"
        az acr login --name "$ACR_NAME"

    - name: Login to GHCR
      if: ${{ inputs.registry-target == 'GITHUB_REGISTRY' }}
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Login to Docker Hub
      if: ${{ inputs.registry-target == 'DOCKER_REGISTRY' }}
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-password }}

    - name: Determine image reference
      id: image-ref
      shell: bash
      run: |
        set -euo pipefail

        SVC="${{ inputs.service-name }}"
        TAG="${{ inputs.image-tag }}"
        TARGET="${{ inputs.registry-target }}"

        case "$TARGET" in
          GITHUB_REGISTRY)
            OWNER="${{ github.repository_owner }}"
            OWNER="${OWNER,,}"
            IMAGE="ghcr.io/$OWNER/$SVC:$TAG"
            ;;
          DOCKER_REGISTRY)
            IMAGE="${{ inputs.dockerhub-username }}/$SVC:$TAG"
            ;;
          AZURE_REGISTRY)
            ACR="${{ inputs.acr-name }}"
            IMAGE="$ACR/$SVC:$TAG"
            ;;
          *)
            echo "::error::Invalid registry-target: $TARGET (expected GITHUB_REGISTRY, DOCKER_REGISTRY, or AZURE_REGISTRY)"
            exit 1
            ;;
        esac

        CACHE_IMAGE="${IMAGE%:*}:buildcache"
        echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
        echo "cache-image=$CACHE_IMAGE" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image
      id: buildx
      uses: docker/build-push-action@v5
      with:
        context: services/${{ inputs.service-name }}
        file: .github/docker/Dockerfile
        build-args: |
          SERVICE_NAME=${{ inputs.service-name }}
          JAR_FILE=target/${{ inputs.service-name }}-*.jar
        tags: ${{ steps.image-ref.outputs.image }}
        push: true
        cache-from: type=registry,ref=${{ steps.image-ref.outputs.cache-image }}
        cache-to: type=registry,ref=${{ steps.image-ref.outputs.cache-image }},mode=max

    - name: Set build outputs
      id: build
      shell: bash
      run: |
        IMAGE="${{ steps.image-ref.outputs.image }}"
        DIGEST="${{ steps.buildx.outputs.digest }}"
        FULL_IMAGE="$IMAGE@$DIGEST"
        echo "image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"
        echo "image-digest=$DIGEST" >> "$GITHUB_OUTPUT"

    - name: Trivy scan
      if: ${{ inputs.scan-trivy }}
      uses: AquaSecurity/trivy-action@master
      with:
        image-ref: ${{ steps.build.outputs.image }}
        format: 'table'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'
        ignore-unfixed: true

    - name: Cosign sign
      if: ${{ inputs.sign-cosign }}
      uses: sigstore/cosign-installer@v3.7.0
      with:
        cosign-installation: cosign
    - name: Cosign sign image
      if: ${{ inputs.sign-cosign }}
      shell: bash
      run: |
        cosign sign --yes "${{ steps.build.outputs.image }}"
