spring:
  liquibase:
    change-log: classpath:db/changelog/preprod/db.changelog-master.yaml

server:
  address: 0.0.0.0
  port: 8080
  host: localhost

management:
  endpoints:
    web:
      exposure:
        # never '*': env/configprops/heapdump would expose the Open Bee API keys in the environment
        include: health,info,prometheus
  # Observability (tracing/logs/metrics) — present in EVERY profile; never in application.yml.
  # Local collector instead of the shared dev one: http://localhost:4318/v1/traces, http://localhost:3100/otlp/v1/logs
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      deployment.environment: ${spring.profiles.active:default}
    tracing:
      export:
        otlp:
          endpoint: ${TRACING_OTLP_ENDPOINT:}
    logging:
      export:
        otlp:
          endpoint: ${LOGS_OTLP_ENDPOINT:}
  observations:
    annotations:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}   # Grafana dashboard filters on this label
    distribution:
      percentiles-histogram:
        http.server.requests: true                # buckets for the p95/p99 panels
  otlp:
    metrics:
      export:
        enabled: false   # Jaeger accepts traces only

cipher:
  password: UseMostSecretKey

company:
  scheduler:
    pool-size: 5
    thread-group-name: document-management-service-scheduled-tasks-
    thread-name-prefix: DocumentManagement-TaskScheduler-Worker-

  logging:
    json:
      enabled: false
      pretty-print: false
    correlation-id:
      response-header: true
    # DMS: payloads, headers and the save/content paths stay out of logs and span tags (metadata values,
    # file names and Content-Disposition can carry client identifiers).
    request:
      enabled: true
      include-headers: false
      include-payload: false
    response:
      enabled: true
      include-payload: false
    excluded-paths:
      - /actuator/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /api/v1/dms/documents
      - /api/v1/dms/documents/*/content
    aspect:
      enabled: true
    performance:
      threshold: 1000ms
    database-logging:
      enabled: true
      include-request-payload: false
      include-response-payload: false
      cleanup-cron: "0 0 2 * * *"
      retention-days: 7
      excluded-paths:
        - /api/v1/info
        - /actuator/**
        - /swagger-ui/**
        - /v3/api-docs/**
        - /api/v1/dms/documents/*/content
    seq:
      enabled: true

  jwt:
    enabled: true
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
    secret: ${JWT_SECRET:defaultSecretKeyChangeMeInProduction1234567890}
    login-url: /api/auth/login
    register-url: /api/auth/register
    refresh-url: /api/auth/refresh
    logout-url: /api/auth/logout
    validate-url: /api/auth/validate
    permit-all-urls:
      - /api/v1/info
      # Add every new public endpoint here instead of writing ad hoc Spring Security config.

  # DB-less services: delete the whole `datasource:` block below (and the corresponding pom.xml /
  # Liquibase pieces — see SKILL.md "DB-less services" variant).
  datasource:
    middleware:
      enabled: true
      url: ${COMPANY_DATASOURCE_MIDDLEWARE_URL:jdbc:postgresql://localhost:5432/alramzmwdb}
      username: ${COMPANY_DATASOURCE_MIDDLEWARE_USERNAME:alramzmw}
      # preprod == dev: plainPassword is acceptable (dev-only, logs a warning).
      # preprod == preprod or prod: replace plainPassword with cipher-encrypted `password` +
      # `passwordVector` (cipher.password above activates PWProtector) — never commit a plaintext
      # password for a non-dev profile. See CLAUDE.md "Do Not Use / Anti-Patterns".
      plainPassword: ${COMPANY_DATASOURCE_MIDDLEWARE_PLAINPASSWORD:alramz!321*}
      driverClassName: ${COMPANY_DATASOURCE_MIDDLEWARE_DRIVERCLASSNAME:org.postgresql.Driver}
      startup-validation:
        enabled: ${COMPANY_DATASOURCE_MIDDLEWARE_STARTUP_VALIDATION_ENABLED:false}
      pool:
        maximum-pool-size: ${COMPANY_DATASOURCE_MIDDLEWARE_POOL_MAXIMUM_POOL_SIZE:10}
        minimum-idle: ${COMPANY_DATASOURCE_MIDDLEWARE_POOL_MINIMUM_IDLE:2}
      sql-logging:
        enabled: false
    # Enable `brok` and/or `integration` here (same shape as `middleware`, plus an `oracle:` block
    # for brok) only if this service actually talks to those datasources — each is an independent
    # Hikari pool and must be injected with an explicit @Qualifier (see CLAUDE.md §4).

# Open Bee (DMS). Startup fails fast unless DMS_OPENBEE_BASE_URL and every consumer key below are set.
# Consumer keys must equal the JWT subject exactly: keep the bracket notation.
dms:
  openbee:
    base-url: ${DMS_OPENBEE_BASE_URL:}
    time-zone: Asia/Dubai
  consumers:
    "[onboarding-portal]":
      api-key: ${DMS_OPENBEE_API_KEY_ONBOARDING_PORTAL:}
    "[crm]":
      api-key: ${DMS_OPENBEE_API_KEY_CRM:}
