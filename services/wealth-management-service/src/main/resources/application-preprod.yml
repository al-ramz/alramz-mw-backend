# Instantiate this once per profile: application-dev.yml, application-preprod.yml, application-prod.yml.
# application-docker.yml and application-test.yml have their own templates (different shape) — see
# application-docker.yml.template and application-test.yml.template.
#
# Placeholders:
#   preprod            dev | preprod | prod
#   wealth-management-service       kebab-case service name, e.g. reward-engine-service
#   WealthManagement      PascalCase short name for scheduler thread names, e.g. RewardEngine
#   8080               dev: a free port in the 808x range not already used by another service;
#                           preprod/prod: 8080 (Kubernetes Service fronts it — see service.yaml)
#     dev: http://172.25.21.114:4318/v1/traces   preprod/prod: (empty)
#        dev: http://172.25.21.114:3100/otlp/v1/logs preprod/prod: (empty)
#                           Non-dev profiles get the endpoints only from the TRACING_OTLP_ENDPOINT /
#                           LOGS_OTLP_ENDPOINT env variables.
#   900000  dev: 86400000 (24h)   preprod/prod: 900000 (15 min, starter default)
spring:
  liquibase:
    change-log: classpath:db/changelog/preprod/db.changelog-master.yaml

server:
  address: 0.0.0.0
  port: 8080
  host: localhost

management:
  endpoints:
    web:
      exposure:
        include: "*"
  # Observability (tracing/logs/metrics) — present in EVERY profile; never in application.yml.
  # Local collector instead of the shared dev one: http://localhost:4318/v1/traces, http://localhost:3100/otlp/v1/logs
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      deployment.environment: ${spring.profiles.active:default}
    tracing:
      export:
        otlp:
          endpoint: ${TRACING_OTLP_ENDPOINT:}
    logging:
      export:
        otlp:
          endpoint: ${LOGS_OTLP_ENDPOINT:}
  observations:
    annotations:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}   # Grafana dashboard filters on this label
    distribution:
      percentiles-histogram:
        http.server.requests: true                # buckets for the p95/p99 panels
  otlp:
    metrics:
      export:
        enabled: false   # Jaeger accepts traces only

cipher:
  password: UseMostSecretKey

company:
  scheduler:
    pool-size: 5
    thread-group-name: wealth-management-service-scheduled-tasks-
    thread-name-prefix: WealthManagement-TaskScheduler-Worker-

  logging:
    json:
      enabled: false
      pretty-print: false
    correlation-id:
      response-header: true
    request:
      enabled: true
      include-headers: true
      include-payload: true
    response:
      enabled: true
      include-payload: true
    aspect:
      enabled: true
    performance:
      threshold: 1000ms
    database-logging:
      enabled: true
      include-request-payload: true
      include-response-payload: true
      cleanup-cron: "0 0 2 * * *"
      retention-days: 7
      excluded-paths:
        - /api/v1/info
        - /actuator/**
        - /swagger-ui/**
        - /v3/api-docs/**
    seq:
      enabled: true

  jwt:
    enabled: true
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
    secret: ${JWT_SECRET:defaultSecretKeyChangeMeInProduction1234567890}
    login-url: /api/auth/login
    register-url: /api/auth/register
    refresh-url: /api/auth/refresh
    logout-url: /api/auth/logout
    validate-url: /api/auth/validate
    permit-all-urls:
      - /api/v1/info
      # Add every new public endpoint here instead of writing ad hoc Spring Security config.

  # DB-less services: delete the whole `datasource:` block below (and the corresponding pom.xml /
  # Liquibase pieces — see SKILL.md "DB-less services" variant).
  datasource:
    middleware:
      enabled: true
      url: ${COMPANY_DATASOURCE_MIDDLEWARE_URL:jdbc:postgresql://localhost:5432/alramzmwdb}
      username: ${COMPANY_DATASOURCE_MIDDLEWARE_USERNAME:alramzmw}
      # Non-dev profile: cipher-encrypted password + passwordVector (cipher.password above
      # activates PWProtector) — never a plaintext plainPassword here.
      password: ${COMPANY_DATASOURCE_MIDDLEWARE_PASSWORD}
      passwordVector: ${COMPANY_DATASOURCE_MIDDLEWARE_PASSWORD_VECTOR}
      driverClassName: ${COMPANY_DATASOURCE_MIDDLEWARE_DRIVERCLASSNAME:org.postgresql.Driver}
      startup-validation:
        enabled: ${COMPANY_DATASOURCE_MIDDLEWARE_STARTUP_VALIDATION_ENABLED:false}
      pool:
        maximum-pool-size: ${COMPANY_DATASOURCE_MIDDLEWARE_POOL_MAXIMUM_POOL_SIZE:10}
        minimum-idle: ${COMPANY_DATASOURCE_MIDDLEWARE_POOL_MINIMUM_IDLE:2}
      sql-logging:
        enabled: false
    # brok (Oracle) — inject with @Qualifier("brokJdbcTemplate") etc.; never the unqualified bean.
    brok:
      enabled: ${COMPANY_DATASOURCE_BROK_ENABLED:true}
      url: ${COMPANY_DATASOURCE_BROK_URL}
      username: ${COMPANY_DATASOURCE_BROK_USERNAME}
      password: ${COMPANY_DATASOURCE_BROK_PASSWORD}
      passwordVector: ${COMPANY_DATASOURCE_BROK_PASSWORD_VECTOR}
      driverClassName: ${COMPANY_DATASOURCE_BROK_DRIVERCLASSNAME:oracle.jdbc.OracleDriver}
      startup-validation:
        enabled: ${COMPANY_DATASOURCE_BROK_STARTUP_VALIDATION_ENABLED:false}
      pool:
        maximum-pool-size: ${COMPANY_DATASOURCE_BROK_POOL_MAXIMUM_POOL_SIZE:10}
        minimum-idle: ${COMPANY_DATASOURCE_BROK_POOL_MINIMUM_IDLE:2}
      sql-logging:
        enabled: false
      oracle:
        connectTimeout: ${COMPANY_DATASOURCE_BROK_ORACLE_CONNECT_TIMEOUT:10000}
        readTimeout: ${COMPANY_DATASOURCE_BROK_ORACLE_READ_TIMEOUT:60000}
        defaultRowPrefetch: ${COMPANY_DATASOURCE_BROK_ORACLE_DEFAULT_ROW_PREFETCH:100}
