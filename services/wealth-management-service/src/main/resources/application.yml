spring:
  application:
    name: wealth-management-service
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
  # Reject 1.5 for an integer field (sweepNo) instead of truncating it to 1 and confirming the wrong sweep.
  jackson:
    deserialization:
      accept-float-as-int: false

# Externalised Oracle SQL for the MMF repository (SqlQueriesManager).
sql:
  file: classpath:sql/sql-queries.xml

server:
  host: localhost
