# Instantiate once per profile at:
#   src/main/resources/db/changelog/{dev,docker,preprod,prod}/db.changelog-master.yaml
#   src/test/resources/db/changelog/test/db.changelog-master.yaml
# preprod = dev | docker | preprod | prod | test (matching the directory it's placed in)
databaseChangeLog:
  - includeAll:
      path: db/changelog/preprod/sql
      # A new service may have no changesets yet (sql/ absent) — without this Liquibase fails startup.
      errorIfMissingOrEmpty: false
