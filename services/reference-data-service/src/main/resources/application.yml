spring:
  application:
    name: reference-data-service
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate

server:
  host: localhost

sql:
  file: classpath:sql/global-configuration-settings-queries.xml,classpath:sql/sql-queries.xml

company:
  redis:
    deployment:
      mode: local
    connection:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: ${REDIS_TIMEOUT:2s}
    cache:
      mappings:
        global-config:
          table: global_configuration_settings
          cache-key: alramz:reference-data:v1:global-config
          reload-strategy: explicit
          ttl: ${CACHE_TTL:3600s}
          enabled: true

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      deployment.environment: ${spring.profiles.active:default}
    tracing:
      export:
        otlp:
          endpoint: ${TRACING_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${LOGS_OTLP_ENDPOINT:http://localhost:3100/otlp/v1/logs}
  observations:
    annotations:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}   # Grafana dashboard filters on this label
    distribution:
      percentiles-histogram:
        http.server.requests: true                # buckets for the p95/p99 panels
  otlp:
    metrics:
      export:
        enabled: false   # Jaeger accepts traces only
