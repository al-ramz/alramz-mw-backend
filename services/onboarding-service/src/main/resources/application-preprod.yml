spring:
  liquibase:
    change-log: classpath:db/changelog/preprod/db.changelog-master.yaml

server:
  address: 0.0.0.0
  port: 8080
  host: localhost

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      deployment.environment: ${spring.profiles.active:default}
    tracing:
      export:
        otlp:
          endpoint: ${TRACING_OTLP_ENDPOINT:}
    logging:
      export:
        otlp:
          endpoint: ${LOGS_OTLP_ENDPOINT:}
  observations:
    annotations:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}   # Grafana dashboard filters on this label
    distribution:
      percentiles-histogram:
        http.server.requests: true                # buckets for the p95/p99 panels
  otlp:
    metrics:
      export:
        enabled: false   # Jaeger accepts traces only

cipher:
  password: UseMostSecretKey

adapter:
  dfm-member-api:
    base-url: ${DFM_MEMBER_API_BASE_URL:}
    onboarding-path: ${DFM_MEMBER_API_ONBOARDING_PATH:/memberapis/onboarding}
    member-code: ${DFM_MEMBER_API_MEMBER_CODE:}
    header-security-key: ${DFM_MEMBER_API_HEADER_SECURITY_KEY:}
    body-security-key: ${DFM_MEMBER_API_BODY_SECURITY_KEY:}
    connect-timeout-seconds: 5
    read-timeout-seconds: 60
    duplicate-in-progress-codes: ${DFM_MEMBER_API_DUPLICATE_IN_PROGRESS_CODES:}
  external-iban-service:
    base-url: https://api.iban.com/clients/api/v4/iban
    api-key: ${IBAN_API_KEY:}
    request-timeout: 10
  external-veriphone-service:
    base-url: https://api.veriphone.io
    api-key: ${VERIPHONE_API_KEY:}
    request-timeout: 10
  etrade:
    base-url: ${ETRADE_BASE_URL:https://etradeqa.alramz.ae}
    client-id: ${ETRADE_CLIENT_ID:1}
    client-secret: ${ETRADE_CLIENT_SECRET:R@mZS4qR5t}
    request-timeout: "30"
    token-ttl-seconds: 3000
    token-path: /IntegrationAPI/IntegrationWServices/GetClientToken
    validations:
      EMAIL_EXISTS:
        path: /IntegrationAPI/IntegrationWServices/IfEmailExists
        method: POST
        request-mapping:
          Reference_No: referenceNo
          emailAddress: email
      PASSPORT_EXISTS:
        path: /IntegrationAPI/IntegrationWServices/IfPassportExists
        method: POST
        request-mapping:
          Reference_No: referenceNo
          pp_number: passportNumber
      USERNAME_EXISTS:
        path: /IntegrationAPI/IntegrationWServices/IfUsernameExists
        method: POST
        request-mapping:
          Reference_No: referenceNo
          username: username
      EID_EXISTS:
        path: /IntegrationAPI/IntegrationWServices/IfEidExists
        method: POST
        request-mapping:
          Reference_No: referenceNo
          eid_number: eidNumber
      TP_UUID_EXISTS:
        path: /IntegrationAPI/IntegrationWServices/IfTPUUIDExists
        method: POST
        request-mapping:
          Reference_No: referenceNo
          UUID: uuid
          thirdParty: thirdParty
      MOBILE_EXISTS:
        path: /IntegrationAPI/IntegrationWServices/IfMobileExists
        method: POST
        request-mapping:
          MobileNo: mobileNumber

company:
  scheduler:
    management-endpoints:
      enabled: true
    pool-size: 5
    thread-group-name: DataValidation-Scheduled-Tasks
    thread-name-prefix: DataValidation-TaskScheduler-Worker-
  logging:
    masking:
      # Starter defaults restated (setting this list replaces them) + DFM investor identifiers, IBANs and Base64 images.
      # Substring, case-insensitive match on JSON keys: also masks e.g. imageType and *warning*; accepted.
      sensitive-keys:
        - password
        - token
        - authorization
        - accessToken
        - refreshToken
        - jwt
        - aadhaar
        - pan
        - ssn
        - creditCard
        - cvv
        - apiKey
        - secret
        - session
        - cookie
        - securitykey
        - nin
        - eidNumber
        - eid_no
        - passportNumber
        - pp_no
        - iban
        - foreignAccount
        - dateOfBirth
        - cust_dob
        - image
        - attachment
        - proofDocument
        - guardianship
        - tin              # FATCA/CRS tax ids (a US FATCA TIN is an SSN/ITIN); also masks hasTin/noTinReason flags, accepted
    json:
      enabled: false
      pretty-print: false
    correlation-id:
      response-header: true
    request:
      enabled: true
      include-headers: true
      include-payload: true
    response:
      enabled: true
      include-payload: true
    aspect:
      enabled: true
    performance:
      threshold: 1000ms
    database-logging:
      enabled: true
      include-request-payload: true
      include-response-payload: true
      cleanup-cron: "0 0 2 * * *"
      retention-days: 7
      excluded-paths:
        - /api/v1/info
        - /actuator/**
        - /swagger-ui/**
        - /v3/api-docs/**
    seq:
      enabled: true
  jwt:
    enabled: true
    secret: ${JWT_SECRET:defaultSecretKeyChangeMeInProduction1234567890}
    login-url: /api/auth/login
    register-url: /api/auth/register
    refresh-url: /api/auth/refresh
    logout-url: /api/auth/logout
    validate-url: /api/auth/validate
    permit-all-urls:
      - /api/v1/info
  datasource:
    middleware:
      enabled: true
      url: ${COMPANY_DATASOURCE_MIDDLEWARE_URL:jdbc:postgresql://localhost:5432/alramzmwdb}
      username: ${COMPANY_DATASOURCE_MIDDLEWARE_USERNAME:alramzmw}
      plainPassword: ${COMPANY_DATASOURCE_MIDDLEWARE_PLAINPASSWORD:alramz!321*}
      driverClassName: ${COMPANY_DATASOURCE_MIDDLEWARE_DRIVERCLASSNAME:org.postgresql.Driver}
      startup-validation:
        enabled: ${COMPANY_DATASOURCE_MIDDLEWARE_STARTUP_VALIDATION_ENABLED:false}
      pool:
        maximum-pool-size: ${COMPANY_DATASOURCE_MIDDLEWARE_POOL_MAXIMUM_POOL_SIZE:10}
        minimum-idle: ${COMPANY_DATASOURCE_MIDDLEWARE_POOL_MINIMUM_IDLE:2}
      sql-logging:
        enabled: false
    brok:
      enabled: true
      url: jdbc:oracle:thin:@//172.25.1.218:1521/BROKDEV
      username: insight
      plainPassword: RAMZ
      driverClassName: oracle.jdbc.OracleDriver
      startup-validation:
        enabled: false
      pool:
        maximum-pool-size: 10
        minimum-idle: 2
      sql-logging:
        enabled: false
      oracle:
        connectTimeout: 10000
        readTimeout: 60000
        defaultRowPrefetch: 100
