server:
  address: 0.0.0.0
  port: 8082
  host: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      deployment.environment: ${spring.profiles.active:default}
    tracing:
      export:
        otlp:
          endpoint: ${TRACING_OTLP_ENDPOINT:http://172.25.21.114:4318/v1/traces} # :http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${LOGS_OTLP_ENDPOINT:http://172.25.21.114:3100/otlp/v1/logs} # :http://localhost:3100/otlp/v1/logs
  observations:
    annotations:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}   # Grafana dashboard filters on this label
    distribution:
      percentiles-histogram:
        http.server.requests: true                # buckets for the p95/p99 panels
  otlp:
    metrics:
      export:
        enabled: false   # Jaeger accepts traces only

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:notificationsdb}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASSNAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

app:
  email:
    service-provider: ${APP_EMAIL_SERVICE_PROVIDER:MICROSOFT_GRAPH}
    max-subject-length: 255
    max-body-length: 10000
    max-attachments: 10
    max-attachment-size-bytes: 10485760

  graph:
    tenant-id: ${AZURE_TENANT_ID}
    client-id: ${AZURE_CLIENT_ID}
    client-secret: ${AZURE_CLIENT_SECRET}
    graph-scopes: https://graph.microsoft.com/.default

company:
  jwt:
    enabled: true
    permit-all-urls:
      - /api/v1/info
      - /api/v1/email/send
      - /actuator/prometheus   # scraped by release/observability Prometheus
  scheduler:
    management-endpoints:
      enabled: true
  logging:
    seq:
      enabled: true
      url: http://seq:80
