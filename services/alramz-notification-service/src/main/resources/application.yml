spring:
  application:
    name: alramz-notification-service
  # autoconfigure:
  #   exclude: com.alramz.jwt.config.JwtAutoConfiguration

server:
  port: 8082
  host: localhost

app:
  email:
    service-provider: MICROSOFT_GRAPH
    max-subject-length: 255
    max-body-length: 10000
    max-attachments: 10
    max-attachment-size-bytes: 10485760

  graph:
    tenant-id: ${AZURE_TENANT_ID}
    client-id: ${AZURE_CLIENT_ID}
    client-secret: ${AZURE_CLIENT_SECRET}
    graph-scopes: https://graph.microsoft.com/.default

company:
  jwt:
    enabled: true
    permit-all-urls:
        - /api/v1/info
        - /api/v1/email/send

  scheduler:
    management-endpoints:
      enabled: true

  logging:
    seq:
      enabled: false

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      deployment.environment: ${spring.profiles.active:default}
    tracing:
      export:
        otlp:
          endpoint: ${TRACING_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${LOGS_OTLP_ENDPOINT:http://localhost:3100/otlp/v1/logs}
  observations:
    annotations:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}   # Grafana dashboard filters on this label
    distribution:
      percentiles-histogram:
        http.server.requests: true                # buckets for the p95/p99 panels
  otlp:
    metrics:
      export:
        enabled: false   # Jaeger accepts traces only
