<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Documentation - Authentication Required</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }

        .auth-header p {
            color: #666;
            font-size: 14px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 10px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: #5568d3;
        }

        button:active {
            transform: scale(0.98);
        }

        .error {
            color: #d32f2f;
            font-size: 12px;
            margin-top: 10px;
            display: none;
            padding: 10px;
            background: #ffebee;
            border-radius: 4px;
            border-left: 3px solid #d32f2f;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>API Documentation</h1>
            <p>Authentication required</p>
        </div>

        <form class="auth-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>

            <div class="error" id="error"></div>

            <button type="submit">Sign In</button>
        </form>
    </div>

    <script>
        // Configuration - inject via environment variables during build
        const CONFIG = {
            username: '${DOCS_USERNAME}',
            password: '${DOCS_PASSWORD}',
            docsUrl: './dist/index.html'
        };

        // Check if already authenticated
        function checkAuth() {
            const auth = sessionStorage.getItem('apiDocsAuth');
            if (auth === 'true') {
                loadDocs();
            }
        }

        function handleLogin(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error');

            if (username === CONFIG.username && password === CONFIG.password) {
                sessionStorage.setItem('apiDocsAuth', 'true');
                loadDocs();
            } else {
                errorEl.textContent = 'Invalid username or password';
                errorEl.classList.add('show');
                document.getElementById('password').value = '';
            }
        }

        function loadDocs() {
            window.location.href = CONFIG.docsUrl;
        }

        // Check auth on page load
        checkAuth();
    </script>
</body>
</html>
